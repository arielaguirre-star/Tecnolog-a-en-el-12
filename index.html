<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnología - Galería de Proyectos</title>
    <!-- Tailwind CSS desde CDN para diseño moderno sin configuración -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Encabezado -->
    <header class="bg-slate-800 border-b border-slate-700 py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-400 tracking-tight">
            Proyectos de Tecnología
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base">
            Muestra de trabajos, prototipos y experiencias del aula de Secundaria
        </p>
    </header>

    <!-- Galería -->
    <!-- Galería con Filtros -->
    <main class="flex-grow container mx-auto px-4 py-8">
        <!-- Botones de Filtro -->
        <div class="flex flex-wrap justify-center gap-2 mb-8" id="contenedor-filtros">
            <button onclick="filtrarProyectos('todos')" class="btn-filtro active bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition hover:bg-indigo-500">
                Todos
            </button>
            <button onclick="filtrarProyectos('1º Año')" class="btn-filtro bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 hover:text-white">
                1º Año
            </button>
            <button onclick="filtrarProyectos('2º Año')" class="btn-filtro bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 hover:text-white">
                2º Año
            </button>
            <button onclick="filtrarProyectos('3º Año')" class="btn-filtro bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-700 hover:text-white">
                3º Año
            </button>
        </div>

        <!-- Grid de la Galería -->
        <div id="galeria-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Los proyectos se cargan dinámicamente -->
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-slate-800 border-t border-slate-700 py-6 text-center text-xs text-slate-500">
        <p>Escuela Secundaria - Área de Tecnología</p>
        <p class="mt-1">Alojado en GitHub Pages</p>
    </footer>

    <!-- Carga de datos y lógica -->
    <script src="proyectos.js"></script>
</body>
</html>
